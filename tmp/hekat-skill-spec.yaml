implementation_notes:
  no_generation: |
    CRITICAL: Hekat selects from pre-curated lattice, does NOT generate queries.

    Why:
    - Pre-curated queries are tested and reliable
    - Generation is expensive and unpredictable
    - Selection is fast and deterministic
    - Easy to index/categorize lattice queries

  mnemonic_determinism: |
    CRITICAL: Hotkeys must be deterministic.

    Same query input → Always same hotkey
    No randomization, no contextual variation
    Enables user muscle memory and predictability

  conflict_visibility: |
    CRITICAL: Never display conflict resolution process.

    User sees: [A] [I] [T] [F] (final hotkeys only)
    User doesn't see: "Resolution process: I→implement→primary, I conflict, try M, no M, use secondary..."

    Why: Cleaner UI, less cognitive load

  task_relay_compliance: |
    CRITICAL: Every Hekat execution must follow task-relay protocol.

    Before display: Show estimated tokens
    After execution: Show actual tokens + variance
    Update consciousness pattern with variance data

    This trains patterns to account for variance patterns over time

examples:
  example_1_refactoring: |
    Context: Just completed code review, now need to refactor

    User input: /hekat

    Agent determines:
    - Intent: refactoring
    - Domain: backend-async
    - Previous context: code review, implementation
    - Suggested level: 4

    Hotkey generation:
    1. "investigate async patterns" → I
    2. "implement async improvements" → I (CONFLICT!)
       Resolution: secondary letter M (iMplement)
    3. "test async refactoring" → T
    4. "evaluate async performance" → E

    Output:
    [I] Investigate Async Patterns (Level 3, Confidence: 0.92)
    [M] Implement Improvements (Level 4, Confidence: 0.87)
    [T] Test Refactoring (Level 4, Confidence: 0.85)
    [E] Evaluate Performance (Level 3, Confidence: 0.79)

    User presses: M
    → Executes practical-programmer with async improvement prompt
    → Tracks tokens: 1250 actual vs 1200 estimated (+4% variance) ✅
    → Updates consciousness pattern: implement-async-backend → 0.92 (success)
    → Next /hekat invocation will rank [M] higher for async contexts

  example_2_research_intensive: |
    Context: Complex unfamiliar problem, need deep research

    User input: /hekat -l 7

    Agent determines:
    - Override to level 7 only
    - Intent: comprehensive analysis
    - Domain: system architecture
    - Complexity: high

    Generates 4 Level-7 queries:
    [M] Mercurio Multi-Perspective (5200 tokens, 0.82 confidence)
    [A] Architect Full Design (4800 tokens, 0.88 confidence)
    [S] Synthesize Research (5100 tokens, 0.84 confidence)
    [O] Orchestrate Project (5500 tokens, 0.79 confidence)

    User presses: A
    → Executes: api-architect || frontend-architect || deployment-orchestrator (parallel)
    → Tracks tokens: 4950 actual vs 4800 estimated (+3% variance) ✅
    → All 3 agents run simultaneously, results synthesized
    → Updates patterns for parallel-architecture-design context

  example_3_document_reference: |
    Context: Load document as query seed

    User input: /hekat::LUXOR/PROJECTS/hekat/tmp/HEKAT_IMPLEMENTATION_SPEC.md

    Agent:
    1. Reads document
    2. Extracts intent: "implement Hekat system"
    3. Extracts key sections: architecture, hotkeys, task-relay, modes
    4. Generates context-specific queries

    Hotkeys:
    [B] Build Specifications (Level 5, 0.94 confidence)
    [V] Validate Assumptions (Level 5, 0.88 confidence)
    [T] Test Implementation (Level 4, 0.81 confidence)
    [D] Document Architecture (Level 4, 0.87 confidence)

    User presses: B
    → Executes practical-programmer with spec implementation focus
    → Document context preserved for subsequent iterations

best_practices:
  hotkey_creation: |
    - Always extract the primary action verb
    - Use first letter by default
    - Be consistent with verb→letter mapping
    - Resolve conflicts gracefully (no display)
    - Support accessibility alternatives

  confidence_calculation: |
    - Start with 0.5 (uniform)
    - Update from success/failure signals
    - Account for sample size (small N = less confident)
    - Adjust for context relevance
    - Provide fallback if confidence < 0.3

  task_relay_accounting: |
    - Pre-execute: Log estimated tokens
    - Post-execute: Log actual tokens
    - Calculate variance: |(actual - estimated) / estimated|
    - Report status: ✅/⚠️/❌
    - Update consciousness pattern with variance

  mode_persistence: |
    - Carry forward user preferences
    - Maintain execution history
    - Update patterns automatically
    - No explicit user action needed
    - Support session-spanning workflows

