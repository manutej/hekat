[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hekat-dsl"
version = "0.1.0"
description = "DSL for Claude Code Agent Orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Hekat Development Team"}
]
keywords = ["dsl", "agent", "orchestration", "claude-code", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
]

dependencies = [
    "lark>=1.1.9",
    "networkx>=3.2",
    "anthropic>=0.25.0",
    "click>=8.1.7",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
voice = [
    "SpeechRecognition>=3.10.0",
    "pyttsx3>=2.90",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.7.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    "pylint>=3.0.0",
    "hypothesis>=6.92.0",
]
mcp = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]

[project.scripts]
hekat = "hekat.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hekat*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=hekat --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
