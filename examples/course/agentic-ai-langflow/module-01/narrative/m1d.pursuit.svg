<svg style="width:100%;height:auto;display:block" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 944 330" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" data-figtree="1" role="img" aria-labelledby="m1d-title m1d-desc"><title id="m1-v3-m1d-title">The journey of one question, in four beats</title><desc id="m1-v3-m1d-desc">Beat 1: the student types a question in the portal. Beat 2: the portal sends it to Langflow with the student&#x27;s session id. Beat 3: Langflow runs the published flow. Beat 4: the reply comes back to the chat window.</desc><rect id="m1-v3-m1d-background" x="0" y="0" width="944" height="330" fill="#FFFFFF" data-role="background"/><defs><marker id="m1-v3-m1d-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,3 L0,6 z" fill="#2B3A4A"/></marker><symbol id="m1-v3-icon-database" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5.5" rx="8" ry="2.5"/><path d="M4 5.5v13c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5v-13"/><path d="M4 12c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5"/></symbol>
<symbol id="m1-v3-icon-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/><path d="M3 17l9 5 9-5"/></symbol>
<symbol id="m1-v3-icon-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6h14M12 6v14M8 20h8"/></symbol>
<symbol id="m1-v3-icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></symbol></defs><text id="m1-v3-m1d-t1" x="24" y="36" font-size="16" fill="#5B6B7C" text-anchor="start" font-weight="600" data-kind="title">The journey of one question</text><rect id="m1-v3-m1d-r2" x="24" y="64" width="206" height="190" rx="8" fill="#E6E8EC" stroke="#2B3A4A" stroke-width="1.4" data-role="block"/><circle id="m1-v3-m1d-c3" cx="48" cy="86" r="12" fill="#2B3A4A"/><text id="m1-v3-m1d-t4" x="48" y="91" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600" data-kind="label">1</text><use id="m1-v3-m1d-i5" href="#m1-v3-icon-user" x="68" y="75" width="22" height="22" color="#2B3A4A" data-role="icon"/><text id="m1-v3-m1d-t6" x="98" y="91" font-size="14" fill="#1C2630" text-anchor="start" font-weight="600" data-kind="label">Student types</text><text id="m1-v3-m1d-t7" x="38" y="120.0" font-size="12.5" fill="#1C2630" text-anchor="start" data-kind="annot">“Do I need a referral to see a</text><text id="m1-v3-m1d-t8" x="38" y="136.875" font-size="12.5" fill="#1C2630" text-anchor="start" data-kind="annot">dermatologist?”</text><path id="m1-v3-m1d-a9" d="M230,160 L254,160" fill="none" stroke="#2B3A4A" stroke-width="1.6" marker-end="url(#m1-v3-m1d-arrow)" data-flow="data"/><rect id="m1-v3-m1d-r10" x="254" y="64" width="206" height="190" rx="8" fill="#F3C9A4" stroke="#2B3A4A" stroke-width="1.4" data-role="block"/><circle id="m1-v3-m1d-c11" cx="278" cy="86" r="12" fill="#2B3A4A"/><text id="m1-v3-m1d-t12" x="278" y="91" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600" data-kind="label">2</text><use id="m1-v3-m1d-i13" href="#m1-v3-icon-database" x="298" y="75" width="22" height="22" color="#2B3A4A" data-role="icon"/><text id="m1-v3-m1d-t14" x="328" y="91" font-size="14" fill="#1C2630" text-anchor="start" font-weight="600" data-kind="label">Portal sends it on</text><text id="m1-v3-m1d-t15" x="268" y="120.0" font-size="12.5" fill="#1C2630" text-anchor="start" data-kind="annot">with session id student:123</text><text id="m1-v3-m1d-t16" x="268" y="136.875" font-size="12.5" fill="#1C2630" text-anchor="start" data-kind="annot">so the conversation stays this</text><text id="m1-v3-m1d-t17" x="268" y="153.75" font-size="12.5" fill="#1C2630" text-anchor="start" data-kind="annot">student&#x27;s</text><path id="m1-v3-m1d-a18" d="M460,160 L484,160" fill="none" stroke="#2B3A4A" stroke-width="1.6" marker-end="url(#m1-v3-m1d-arrow)" data-flow="data"/><rect id="m1-v3-m1d-r19" x="484" y="64" width="206" height="190" rx="8" fill="#C9DCF0" stroke="#2B3A4A" stroke-width="1.4" data-role="block"/><circle id="m1-v3-m1d-c20" cx="508" cy="86" r="12" fill="#2B3A4A"/><text id="m1-v3-m1d-t21" x="508" y="91" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600" data-kind="label">3</text><use id="m1-v3-m1d-i22" href="#m1-v3-icon-layers" x="528" y="75" width="22" height="22" color="#2B3A4A" data-role="icon"/><text id="m1-v3-m1d-t23" x="558" y="91" font-size="14" fill="#1C2630" text-anchor="start" font-weight="600" data-kind="label">Langflow runs it</text><text id="m1-v3-m1d-t24" x="498" y="120.0" font-size="12.5" fill="#1C2630" text-anchor="start" data-kind="annot">Chat Input → Prompt → Model</text><text id="m1-v3-m1d-t25" x="498" y="136.875" font-size="12.5" fill="#1C2630" text-anchor="start" data-kind="annot">→ Chat Output, about two</text><text id="m1-v3-m1d-t26" x="498" y="153.75" font-size="12.5" fill="#1C2630" text-anchor="start" data-kind="annot">seconds</text><path id="m1-v3-m1d-a27" d="M690,160 L714,160" fill="none" stroke="#2B3A4A" stroke-width="1.6" marker-end="url(#m1-v3-m1d-arrow)" data-flow="data"/><rect id="m1-v3-m1d-r28" x="714" y="64" width="206" height="190" rx="8" fill="#E6E8EC" stroke="#2B3A4A" stroke-width="1.4" data-role="block"/><circle id="m1-v3-m1d-c29" cx="738" cy="86" r="12" fill="#2B3A4A"/><text id="m1-v3-m1d-t30" x="738" y="91" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600" data-kind="label">4</text><use id="m1-v3-m1d-i31" href="#m1-v3-icon-text" x="758" y="75" width="22" height="22" color="#2B3A4A" data-role="icon"/><text id="m1-v3-m1d-t32" x="788" y="91" font-size="14" fill="#1C2630" text-anchor="start" font-weight="600" data-kind="label">Reply appears</text><text id="m1-v3-m1d-t33" x="728" y="120.0" font-size="12.5" fill="#1C2630" text-anchor="start" data-kind="annot">“On the Silver PPO, no</text><text id="m1-v3-m1d-t34" x="728" y="136.875" font-size="12.5" fill="#1C2630" text-anchor="start" data-kind="annot">referral is needed for</text><text id="m1-v3-m1d-t35" x="728" y="153.75" font-size="12.5" fill="#1C2630" text-anchor="start" data-kind="annot">in-network specialists.”</text><text id="m1-v3-m1d-t36" x="24" y="284.0" font-size="13" fill="#5B6B7C" text-anchor="start" data-kind="annot">The student never sees Langflow. They see one chat window; everything between beat 1 and beat 4 is the agent you built.</text></svg>
