<svg style="width:100%;height:auto;display:block" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 944 310" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" data-figtree="1" role="img" aria-labelledby="m1c-title m1c-desc"><title id="m1-v2-m1c-title">Where the model key lives: on the class server, never in a browser</title><desc id="m1-v2-m1c-desc">The student&#x27;s browser talks only to the class portal. The portal holds the model provider key in a safe and calls Langflow; Langflow calls the model provider. The key never travels to the browser.</desc><rect id="m1-v2-m1c-background" x="0" y="0" width="944" height="310" fill="#FFFFFF" data-role="background"/><defs><marker id="m1-v2-m1c-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,3 L0,6 z" fill="#2B3A4A"/></marker><symbol id="m1-v2-icon-bolt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L5 14h6l-1 8 9-12h-6z"/></symbol>
<symbol id="m1-v2-icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></symbol>
<symbol id="m1-v2-icon-database" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5.5" rx="8" ry="2.5"/><path d="M4 5.5v13c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5v-13"/><path d="M4 12c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5"/></symbol>
<symbol id="m1-v2-icon-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/><path d="M3 17l9 5 9-5"/></symbol>
<symbol id="m1-v2-icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></symbol></defs><text id="m1-v2-m1c-t1" x="24" y="36" font-size="16" fill="#5B6B7C" text-anchor="start" font-weight="600" data-kind="title">Where the key lives</text><rect id="m1-v2-m1c-r2" x="24" y="64" width="206" height="150" rx="8" fill="#E6E8EC" stroke="#2B3A4A" stroke-width="1.4" data-role="block"/><use id="m1-v2-m1c-i3" href="#m1-v2-icon-user" x="38" y="78" width="22" height="22" color="#2B3A4A" data-role="icon"/><text id="m1-v2-m1c-t4" x="68" y="96" font-size="14.5" fill="#1C2630" text-anchor="start" font-weight="600" data-kind="label">Student&#x27;s browser</text><text id="m1-v2-m1c-t5" x="38" y="124.0" font-size="12.5" fill="#5B6B7C" text-anchor="start" data-kind="annot">Sends the question. Holds no</text><text id="m1-v2-m1c-t6" x="38" y="140.875" font-size="12.5" fill="#5B6B7C" text-anchor="start" data-kind="annot">key.</text><path id="m1-v2-m1c-a7" d="M230,139 L254,139" fill="none" stroke="#2B3A4A" stroke-width="1.6" marker-end="url(#m1-v2-m1c-arrow)" data-flow="data"/><rect id="m1-v2-m1c-r8" x="254" y="64" width="206" height="150" rx="8" fill="#F3C9A4" stroke="#2B3A4A" stroke-width="1.4" data-role="block"/><use id="m1-v2-m1c-i9" href="#m1-v2-icon-database" x="268" y="78" width="22" height="22" color="#2B3A4A" data-role="icon"/><text id="m1-v2-m1c-t10" x="298" y="96" font-size="14.5" fill="#1C2630" text-anchor="start" font-weight="600" data-kind="label">Class portal (server)</text><text id="m1-v2-m1c-t11" x="268" y="124.0" font-size="12.5" fill="#5B6B7C" text-anchor="start" data-kind="annot">Holds the provider key. Adds</text><text id="m1-v2-m1c-t12" x="268" y="140.875" font-size="12.5" fill="#5B6B7C" text-anchor="start" data-kind="annot">the student&#x27;s session id.</text><path id="m1-v2-m1c-a13" d="M460,139 L484,139" fill="none" stroke="#2B3A4A" stroke-width="1.6" marker-end="url(#m1-v2-m1c-arrow)" data-flow="data"/><rect id="m1-v2-m1c-r14" x="484" y="64" width="206" height="150" rx="8" fill="#C9DCF0" stroke="#2B3A4A" stroke-width="1.4" data-role="block"/><use id="m1-v2-m1c-i15" href="#m1-v2-icon-layers" x="498" y="78" width="22" height="22" color="#2B3A4A" data-role="icon"/><text id="m1-v2-m1c-t16" x="528" y="96" font-size="14.5" fill="#1C2630" text-anchor="start" font-weight="600" data-kind="label">Langflow</text><text id="m1-v2-m1c-t17" x="498" y="124.0" font-size="12.5" fill="#5B6B7C" text-anchor="start" data-kind="annot">Runs the published flow.</text><path id="m1-v2-m1c-a18" d="M690,139 L714,139" fill="none" stroke="#2B3A4A" stroke-width="1.6" marker-end="url(#m1-v2-m1c-arrow)" data-flow="data"/><rect id="m1-v2-m1c-r19" x="714" y="64" width="206" height="150" rx="8" fill="#C9DCF0" stroke="#2B3A4A" stroke-width="1.4" data-role="block"/><use id="m1-v2-m1c-i20" href="#m1-v2-icon-bolt" x="728" y="78" width="22" height="22" color="#2B3A4A" data-role="icon"/><text id="m1-v2-m1c-t21" x="758" y="96" font-size="14.5" fill="#1C2630" text-anchor="start" font-weight="600" data-kind="label">Model provider</text><text id="m1-v2-m1c-t22" x="728" y="124.0" font-size="12.5" fill="#5B6B7C" text-anchor="start" data-kind="annot">Receives the key with each</text><text id="m1-v2-m1c-t23" x="728" y="140.875" font-size="12.5" fill="#5B6B7C" text-anchor="start" data-kind="annot">call.</text><rect id="m1-v2-m1c-r24" x="268" y="176" width="110" height="26" rx="13" fill="#D5EBDD" stroke="#2F8F6B" stroke-width="1.2" data-role="block"/><use id="m1-v2-m1c-i25" href="#m1-v2-icon-check" x="276" y="179" width="18" height="18" color="#2F8F6B" data-role="icon"/><text id="m1-v2-m1c-t26" x="300" y="194" font-size="12" fill="#2F8F6B" text-anchor="start" font-weight="600" data-kind="label">provider key</text><rect id="m1-v2-m1c-r27" x="728" y="176" width="110" height="26" rx="13" fill="#D5EBDD" stroke="#2F8F6B" stroke-width="1.2" data-role="block"/><use id="m1-v2-m1c-i28" href="#m1-v2-icon-check" x="736" y="179" width="18" height="18" color="#2F8F6B" data-role="icon"/><text id="m1-v2-m1c-t29" x="760" y="194" font-size="12" fill="#2F8F6B" text-anchor="start" font-weight="600" data-kind="label">provider key</text><rect id="m1-v2-m1c-r30" x="38" y="176" width="110" height="26" rx="13" fill="#F6D9D2" stroke="#B5472F" stroke-width="1.2" data-role="block"/><text id="m1-v2-m1c-t31" x="93" y="194" font-size="12" fill="#B5472F" text-anchor="middle" font-weight="600" data-kind="label">no key here</text><text id="m1-v2-m1c-t32" x="24" y="246.0" font-size="13" fill="#5B6B7C" text-anchor="start" data-kind="annot">Why it matters: anything in a browser can be copied. A key that stays on the server can be rotated in one place, and a student can</text><text id="m1-v2-m1c-t33" x="24" y="263.55" font-size="13" fill="#5B6B7C" text-anchor="start" data-kind="annot">never run up the bill from their laptop. The export you commit to git carries no key either.</text></svg>
