<svg style="width:100%;height:auto;display:block" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 944 250" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" data-figtree="1" role="img" aria-labelledby="m1e-title m1e-desc"><title id="m1-v4-m1e-title">What a good answer looks like in this class</title><desc id="m1-v4-m1e-desc">Three checks for every reply: it comes from the plan documents, it says when it does not know, and it keeps PPO and HMO facts straight across turns.</desc><rect id="m1-v4-m1e-background" x="0" y="0" width="944" height="250" fill="#FFFFFF" data-role="background"/><defs><marker id="m1-v4-m1e-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,3 L0,6 z" fill="#2B3A4A"/></marker><symbol id="m1-v4-icon-document" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 17h7"/></symbol>
<symbol id="m1-v4-icon-loop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.7-5.7L20 8"/><path d="M20 4v4h-4"/><path d="M20 12a8 8 0 0 1-13.7 5.7L4 16"/><path d="M4 20v-4h4"/></symbol>
<symbol id="m1-v4-icon-residual" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12,3 20,16 4,16"/><line x1="12" y1="8" x2="12" y2="10.5"/><line x1="12" y1="13.5" x2="12" y2="13.5"/><line x1="12" y1="16" x2="12" y2="21"/></symbol></defs><text id="m1-v4-m1e-t1" x="24" y="36" font-size="16" fill="#5B6B7C" text-anchor="start" font-weight="600" data-kind="title">Three checks for every reply</text><rect id="m1-v4-m1e-r2" x="24" y="64" width="282" height="150" rx="8" fill="#F8F9FB" stroke="#D5DBE4" stroke-width="1.4" data-role="block"/><use id="m1-v4-m1e-i3" href="#m1-v4-icon-document" x="40" y="80" width="24" height="24" color="#2F8F6B" data-role="icon"/><text id="m1-v4-m1e-t4" x="74" y="98" font-size="15" fill="#1C2630" text-anchor="start" font-weight="600" data-kind="label">Grounded</text><text id="m1-v4-m1e-t5" x="40" y="128.0" font-size="13" fill="#5B6B7C" text-anchor="start" data-kind="annot">Every fact traces to a plan document.</text><text id="m1-v4-m1e-t6" x="40" y="145.55" font-size="13" fill="#5B6B7C" text-anchor="start" data-kind="annot">No guessing, no general internet</text><text id="m1-v4-m1e-t7" x="40" y="163.1" font-size="13" fill="#5B6B7C" text-anchor="start" data-kind="annot">advice.</text><rect id="m1-v4-m1e-r8" x="318" y="64" width="282" height="150" rx="8" fill="#F8F9FB" stroke="#D5DBE4" stroke-width="1.4" data-role="block"/><use id="m1-v4-m1e-i9" href="#m1-v4-icon-residual" x="334" y="80" width="24" height="24" color="#2F8F6B" data-role="icon"/><text id="m1-v4-m1e-t10" x="368" y="98" font-size="15" fill="#1C2630" text-anchor="start" font-weight="600" data-kind="label">Honest about gaps</text><text id="m1-v4-m1e-t11" x="334" y="128.0" font-size="13" fill="#5B6B7C" text-anchor="start" data-kind="annot">If the documents do not say, the reply</text><text id="m1-v4-m1e-t12" x="334" y="145.55" font-size="13" fill="#5B6B7C" text-anchor="start" data-kind="annot">says so and gives a phone number.</text><rect id="m1-v4-m1e-r13" x="612" y="64" width="282" height="150" rx="8" fill="#F8F9FB" stroke="#D5DBE4" stroke-width="1.4" data-role="block"/><use id="m1-v4-m1e-i14" href="#m1-v4-icon-loop" x="628" y="80" width="24" height="24" color="#2F8F6B" data-role="icon"/><text id="m1-v4-m1e-t15" x="662" y="98" font-size="15" fill="#1C2630" text-anchor="start" font-weight="600" data-kind="label">Consistent</text><text id="m1-v4-m1e-t16" x="628" y="128.0" font-size="13" fill="#5B6B7C" text-anchor="start" data-kind="annot">Turn 1 says PPO; turn 3 still answers</text><text id="m1-v4-m1e-t17" x="628" y="145.55" font-size="13" fill="#5B6B7C" text-anchor="start" data-kind="annot">for a PPO. Nothing contradicts the lab</text><text id="m1-v4-m1e-t18" x="628" y="163.1" font-size="13" fill="#5B6B7C" text-anchor="start" data-kind="annot">facts.</text></svg>
