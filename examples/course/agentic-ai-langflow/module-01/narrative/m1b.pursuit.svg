<svg style="width:100%;height:auto;display:block" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 944 470" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" data-figtree="1" role="img" aria-labelledby="m1b-title m1b-desc"><title id="m1-v1-m1b-title">The four parts of your first agent, with what each one holds</title><desc id="m1-v1-m1b-desc">Chat Input holds the member&#x27;s question. Prompt Template holds the standing instructions and the question. The Chat Model writes the answer. Chat Output shows it. A Knowledge Base of plan documents can feed passages into the prompt.</desc><rect id="m1-v1-m1b-background" x="0" y="0" width="944" height="470" fill="#FFFFFF" data-role="background"/><defs><marker id="m1-v1-m1b-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,3 L0,6 z" fill="#2B3A4A"/></marker><symbol id="m1-v1-icon-bolt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L5 14h6l-1 8 9-12h-6z"/></symbol>
<symbol id="m1-v1-icon-database" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5.5" rx="8" ry="2.5"/><path d="M4 5.5v13c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5v-13"/><path d="M4 12c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5"/></symbol>
<symbol id="m1-v1-icon-edit-script" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h11M3 10h8M3 15h5"/><path d="M10 21l.5-3.5L18 10l3 3-7.5 7.5z"/><path d="M16 12l3 3"/></symbol>
<symbol id="m1-v1-icon-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6h14M12 6v14M8 20h8"/></symbol>
<symbol id="m1-v1-icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></symbol></defs><text id="m1-v1-m1b-t1" x="24" y="36" font-size="16" fill="#5B6B7C" text-anchor="start" font-weight="600" data-kind="title">What each part holds for one real question</text><rect id="m1-v1-m1b-r2" x="24" y="64" width="206" height="236" rx="8" fill="#E6E8EC" stroke="#2B3A4A" stroke-width="1.4" data-role="block"/><use id="m1-v1-m1b-i3" href="#m1-v1-icon-user" x="38" y="78" width="22" height="22" color="#2B3A4A" data-role="icon"/><text id="m1-v1-m1b-t4" x="68" y="96" font-size="15" fill="#1C2630" text-anchor="start" font-weight="600" data-kind="label">Chat Input</text><text id="m1-v1-m1b-t5" x="38" y="126.0" font-size="12" fill="#5B6B7C" text-anchor="start" data-kind="annot">The member&#x27;s words, exactly</text><text id="m1-v1-m1b-t6" x="38" y="142.2" font-size="12" fill="#5B6B7C" text-anchor="start" data-kind="annot">as typed:</text><rect id="m1-v1-m1b-r7" x="38" y="153" width="178" height="120" rx="6" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1" data-role="block"/><text id="m1-v1-m1b-t8" x="48" y="175.0" font-size="12.5" fill="#1C2630" text-anchor="start" data-kind="annot">“Is an MRI covered on the</text><text id="m1-v1-m1b-t9" x="48" y="191.875" font-size="12.5" fill="#1C2630" text-anchor="start" data-kind="annot">Silver PPO?”</text><path id="m1-v1-m1b-a10" d="M230,180 L254,180" fill="none" stroke="#2B3A4A" stroke-width="1.6" marker-end="url(#m1-v1-m1b-arrow)" data-flow="data"/><rect id="m1-v1-m1b-r11" x="254" y="64" width="206" height="236" rx="8" fill="#F3C9A4" stroke="#2B3A4A" stroke-width="1.4" data-role="block"/><use id="m1-v1-m1b-i12" href="#m1-v1-icon-edit-script" x="268" y="78" width="22" height="22" color="#2B3A4A" data-role="icon"/><text id="m1-v1-m1b-t13" x="298" y="96" font-size="15" fill="#1C2630" text-anchor="start" font-weight="600" data-kind="label">Prompt Template</text><text id="m1-v1-m1b-t14" x="268" y="126.0" font-size="12" fill="#5B6B7C" text-anchor="start" data-kind="annot">The standing instructions, then</text><text id="m1-v1-m1b-t15" x="268" y="142.2" font-size="12" fill="#5B6B7C" text-anchor="start" data-kind="annot">the question:</text><rect id="m1-v1-m1b-r16" x="268" y="153" width="178" height="120" rx="6" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1" data-role="block"/><text id="m1-v1-m1b-t17" x="278" y="175.0" font-size="12.5" fill="#1C2630" text-anchor="start" data-kind="annot">“You answer only from the</text><text id="m1-v1-m1b-t18" x="278" y="191.875" font-size="12.5" fill="#1C2630" text-anchor="start" data-kind="annot">plan documents provided.</text><text id="m1-v1-m1b-t19" x="278" y="208.75" font-size="12.5" fill="#1C2630" text-anchor="start" data-kind="annot">If the documents do not</text><text id="m1-v1-m1b-t20" x="278" y="225.625" font-size="12.5" fill="#1C2630" text-anchor="start" data-kind="annot">say, say so and offer a</text><text id="m1-v1-m1b-t21" x="278" y="242.5" font-size="12.5" fill="#1C2630" text-anchor="start" data-kind="annot">phone number.”</text><path id="m1-v1-m1b-a22" d="M460,180 L484,180" fill="none" stroke="#2B3A4A" stroke-width="1.6" marker-end="url(#m1-v1-m1b-arrow)" data-flow="data"/><rect id="m1-v1-m1b-r23" x="484" y="64" width="206" height="236" rx="8" fill="#C9DCF0" stroke="#2B3A4A" stroke-width="1.4" data-role="block"/><use id="m1-v1-m1b-i24" href="#m1-v1-icon-bolt" x="498" y="78" width="22" height="22" color="#2B3A4A" data-role="icon"/><text id="m1-v1-m1b-t25" x="528" y="96" font-size="15" fill="#1C2630" text-anchor="start" font-weight="600" data-kind="label">Chat Model</text><text id="m1-v1-m1b-t26" x="498" y="126.0" font-size="12" fill="#5B6B7C" text-anchor="start" data-kind="annot">Writes the answer from the</text><text id="m1-v1-m1b-t27" x="498" y="142.2" font-size="12" fill="#5B6B7C" text-anchor="start" data-kind="annot">prompt:</text><rect id="m1-v1-m1b-r28" x="498" y="153" width="178" height="120" rx="6" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1" data-role="block"/><text id="m1-v1-m1b-t29" x="508" y="175.0" font-size="12.5" fill="#1C2630" text-anchor="start" data-kind="annot">Reads instructions,</text><text id="m1-v1-m1b-t30" x="508" y="191.875" font-size="12.5" fill="#1C2630" text-anchor="start" data-kind="annot">documents and question</text><text id="m1-v1-m1b-t31" x="508" y="208.75" font-size="12.5" fill="#1C2630" text-anchor="start" data-kind="annot">together; writes one reply.</text><path id="m1-v1-m1b-a32" d="M690,180 L714,180" fill="none" stroke="#2B3A4A" stroke-width="1.6" marker-end="url(#m1-v1-m1b-arrow)" data-flow="data"/><rect id="m1-v1-m1b-r33" x="714" y="64" width="206" height="236" rx="8" fill="#E6E8EC" stroke="#2B3A4A" stroke-width="1.4" data-role="block"/><use id="m1-v1-m1b-i34" href="#m1-v1-icon-text" x="728" y="78" width="22" height="22" color="#2B3A4A" data-role="icon"/><text id="m1-v1-m1b-t35" x="758" y="96" font-size="15" fill="#1C2630" text-anchor="start" font-weight="600" data-kind="label">Chat Output</text><text id="m1-v1-m1b-t36" x="728" y="126.0" font-size="12" fill="#5B6B7C" text-anchor="start" data-kind="annot">The reply the member sees:</text><rect id="m1-v1-m1b-r37" x="728" y="136" width="178" height="120" rx="6" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1" data-role="block"/><text id="m1-v1-m1b-t38" x="738" y="158.0" font-size="12.5" fill="#1C2630" text-anchor="start" data-kind="annot">“Yes. On the Silver PPO</text><text id="m1-v1-m1b-t39" x="738" y="174.875" font-size="12.5" fill="#1C2630" text-anchor="start" data-kind="annot">an MRI needs prior</text><text id="m1-v1-m1b-t40" x="738" y="191.75" font-size="12.5" fill="#1C2630" text-anchor="start" data-kind="annot">authorisation and is</text><text id="m1-v1-m1b-t41" x="738" y="208.625" font-size="12.5" fill="#1C2630" text-anchor="start" data-kind="annot">covered at 80% in</text><text id="m1-v1-m1b-t42" x="738" y="225.5" font-size="12.5" fill="#1C2630" text-anchor="start" data-kind="annot">network.”</text><rect id="m1-v1-m1b-r43" x="254" y="340" width="206" height="96" rx="8" fill="#F6EFD2" stroke="#2B3A4A" stroke-width="1.4" data-role="block"/><use id="m1-v1-m1b-i44" href="#m1-v1-icon-database" x="268" y="354" width="22" height="22" color="#2B3A4A" data-role="icon"/><text id="m1-v1-m1b-t45" x="298" y="372" font-size="15" fill="#1C2630" text-anchor="start" font-weight="600" data-kind="label">Knowledge Base</text><text id="m1-v1-m1b-t46" x="268" y="398.0" font-size="12" fill="#5B6B7C" text-anchor="start" data-kind="annot">Optional. Plan documents the</text><text id="m1-v1-m1b-t47" x="268" y="414.2" font-size="12" fill="#5B6B7C" text-anchor="start" data-kind="annot">agent may quote: the Silver</text><text id="m1-v1-m1b-t48" x="268" y="430.4" font-size="12" fill="#5B6B7C" text-anchor="start" data-kind="annot">PPO summary, the prior-auth</text><text id="m1-v1-m1b-t49" x="268" y="446.6" font-size="12" fill="#5B6B7C" text-anchor="start" data-kind="annot">list.</text><path id="m1-v1-m1b-a50" d="M357,340 L357,300" fill="none" stroke="#2B3A4A" stroke-width="1.6" marker-end="url(#m1-v1-m1b-arrow)" data-flow="data"/><text id="m1-v1-m1b-t51" x="372" y="326" font-size="11.5" fill="#5B6B7C" text-anchor="start" data-kind="annot">passages are added to the prompt</text><text id="m1-v1-m1b-t52" x="500" y="372.0" font-size="13" fill="#5B6B7C" text-anchor="start" data-kind="annot">Only the Prompt Template is written by you. The other parts</text><text id="m1-v1-m1b-t53" x="500" y="389.55" font-size="13" fill="#5B6B7C" text-anchor="start" data-kind="annot">are standard components you drag onto the canvas and</text><text id="m1-v1-m1b-t54" x="500" y="407.1" font-size="13" fill="#5B6B7C" text-anchor="start" data-kind="annot">connect.</text></svg>
