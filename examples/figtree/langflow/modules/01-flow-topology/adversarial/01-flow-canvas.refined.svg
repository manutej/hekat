<svg xmlns="http://www.w3.org/2000/svg" width="416" height="112" viewBox="0 0 416 112" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" data-figtree="1">
  <title id="e1-title">Flow canvas and components</title>
  <rect id="background" x="0" y="0" width="416" height="112" fill="#FFFFFF" data-role="background" />
  <defs id="e2-defs">
    <marker id="figtree-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 z" fill="#2B3A4A" id="e3-path" />
    </marker>
  </defs>
  <g id="n1" data-bbox="0 0 416 112">
