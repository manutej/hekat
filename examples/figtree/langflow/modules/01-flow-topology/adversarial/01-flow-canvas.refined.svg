      <!-- PORT:top x=56 y=0 id=n2.top type=input component="Flow Canvas" -->
      <!-- PORT:bottom x=56 y=48 id=n2.bottom type=output component="Flow Canvas" -->
      <rect id="n2.block" x="0" y="0" width="112" height="48" fill="#C9DCF0" stroke="#2B3A4A" stroke-width="1.4" data-role="block" rx="6" data-component="Flow Canvas" />
      <text id="n2.label" x="56" y="24" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#1C2630" data-kind="label" data-max-width="112">Flow Canvas</text>
    </g>
    <g id="n3" transform="translate(184,32)" data-bbox="184 32 96 48" data-label="Component">
