    <!-- PORT:right x=144 y=56 id=n2.right type=output component="Flow Canvas" -->
    <!-- PORT:top x=88 y=32 id=n2.top type=input component="Flow Canvas" -->
    <!-- PORT:bottom x=88 y=80 id=n2.bottom type=output component="Flow Canvas" -->
    <!-- PORT:left x=184 y=56 id=n3.left type=input component="Component" -->
    <!-- PORT:right x=280 y=56 id=n3.right type=output component="Component" -->
    <!-- PORT:top x=232 y=32 id=n3.top type=input component="Component" -->
    <!-- PORT:bottom x=232 y=80 id=n3.bottom type=output component="Component" -->
    <!-- PORT:left x=320 y=56 id=n4.left type=input component="Port" -->
    <!-- PORT:right x=384 y=56 id=n4.right type=output component="Port" -->
    <!-- PORT:top x=352 y=32 id=n4.top type=input component="Port" -->
    <!-- PORT:bottom x=352 y=80 id=n4.bottom type=output component="Port" -->
    <g id="n2" transform="translate(32,32)" data-bbox="32 32 112 48" data-label="Flow Canvas">
