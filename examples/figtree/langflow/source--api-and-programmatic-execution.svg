<svg xmlns="http://www.w3.org/2000/svg" width="888" height="248" viewBox="0 0 888 248" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" data-figtree="1">
  <title>Applications invoke flows through Langflow API POST /api/v1/run/FLOW_ID. Tweaks can modify MCP Tools Component environment variables at runtime.</title>
