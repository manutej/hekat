<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300" font-family="Arial">
  <rect id="background" width="500" height="300" fill="#FFFFFF"/>
  <text id="title" x="250" y="24" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#333333" font-weight="bold">Variant B reaches the highest accuracy</text>
  <line id="axis-x" x1="70" y1="250" x2="440" y2="250" stroke="#000000" stroke-width="1"/>
  <line id="axis-y" x1="70" y1="250" x2="70" y2="50" stroke="#000000" stroke-width="1"/>
  <text id="tick-y-0" x="64" y="250" font-size="11" text-anchor="end" dominant-baseline="middle" fill="#333333">0</text>
  <text id="tick-y-50" x="64" y="150" font-size="11" text-anchor="end" dominant-baseline="middle" fill="#333333">50</text>
  <text id="tick-y-100" x="64" y="50" font-size="11" text-anchor="end" dominant-baseline="middle" fill="#333333">100</text>
  <path id="bar-0" d="M90,140 h60 v110 h-60 z" fill="#2F4E7D"/>
  <text id="value-0" x="120" y="156" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#4A4A4A">55</text>
  <text id="tick-x-0" x="120" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">Baseline</text>
  <path id="bar-1" d="M185,106 h60 v144 h-60 z" fill="#2F4E7D"/>
  <text id="value-1" x="215" y="122" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#4A4A4A">72</text>
  <text id="tick-x-1" x="215" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">Variant A</text>
  <path id="bar-2" d="M280,68 h60 v182 h-60 z" fill="#2F4E7D"/>
  <text id="value-2" x="310" y="84" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#4A4A4A">91</text>
  <text id="tick-x-2" x="310" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">Variant B</text>
  <path id="bar-3" d="M375,170 h60 v80 h-60 z" fill="#2F4E7D"/>
  <text id="value-3" x="405" y="186" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#4A4A4A">40</text>
  <text id="tick-x-3" x="405" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">Ablation</text>
  <text id="axis-x-label" x="255" y="288" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#333333" data-role="axis-label">Configuration</text>
  <text id="axis-y-label" x="22" y="150" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#333333" data-role="axis-label" transform="rotate(-90 22 150)">Accuracy (%)</text>
</svg>
