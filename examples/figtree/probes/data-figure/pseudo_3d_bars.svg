<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300" font-family="Arial">
  <rect id="background" width="500" height="300" fill="#FFFFFF"/>
  <text id="title" x="250" y="24" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#333333" font-weight="bold">Variant B reaches the highest accuracy</text>
  <line id="axis-x" x1="70" y1="250" x2="440" y2="250" stroke="#000000" stroke-width="1"/>
  <line id="axis-y" x1="70" y1="250" x2="70" y2="50" stroke="#000000" stroke-width="1"/>
  <text id="tick-y-0" x="64" y="250" font-size="11" text-anchor="end" dominant-baseline="middle" fill="#333333">0</text>
  <text id="tick-y-50" x="64" y="150" font-size="11" text-anchor="end" dominant-baseline="middle" fill="#333333">50</text>
  <text id="tick-y-100" x="64" y="50" font-size="11" text-anchor="end" dominant-baseline="middle" fill="#333333">100</text>
  <rect id="bar-0-front" x="90" y="140" width="50" height="110" fill="#4C72B0"/>
  <polygon id="bar-0-top" points="90,140 140,140 154,130 104,130" fill="#7D9BCB"/>
  <polygon id="bar-0-side" points="140,140 154,130 154,240 140,250" fill="#2F4E7D"/>
  <text id="tick-x-0" x="122" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">Baseline</text>
  <rect id="bar-1-front" x="185" y="106" width="50" height="144" fill="#4C72B0"/>
  <polygon id="bar-1-top" points="185,106 235,106 249,96 199,96" fill="#7D9BCB"/>
  <polygon id="bar-1-side" points="235,106 249,96 249,240 235,250" fill="#2F4E7D"/>
  <text id="tick-x-1" x="217" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">Variant A</text>
  <rect id="bar-2-front" x="280" y="68" width="50" height="182" fill="#4C72B0"/>
  <polygon id="bar-2-top" points="280,68 330,68 344,58 294,58" fill="#7D9BCB"/>
  <polygon id="bar-2-side" points="330,68 344,58 344,240 330,250" fill="#2F4E7D"/>
  <text id="tick-x-2" x="312" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">Variant B</text>
  <rect id="bar-3-front" x="375" y="170" width="50" height="80" fill="#4C72B0"/>
  <polygon id="bar-3-top" points="375,170 425,170 439,160 389,160" fill="#7D9BCB"/>
  <polygon id="bar-3-side" points="425,170 439,160 439,240 425,250" fill="#2F4E7D"/>
  <text id="tick-x-3" x="407" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">Ablation</text>
  <text id="axis-x-label" x="255" y="288" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#333333" data-role="axis-label">Configuration</text>
  <text id="axis-y-label" x="22" y="150" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#333333" data-role="axis-label" transform="rotate(-90 22 150)">Accuracy (%)</text>
</svg>
