<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300" font-family="Arial">
  <rect id="background" width="500" height="300" fill="#FFFFFF"/>
  <text id="title" x="250" y="24" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#333333" font-weight="bold">Throughput saturates above 40 ms latency</text>
  <line id="axis-x" x1="70" y1="250" x2="440" y2="250" stroke="#000000" stroke-width="1"/>
  <line id="axis-y" x1="70" y1="250" x2="70" y2="50" stroke="#000000" stroke-width="1"/>
  <text id="tick-y-0" x="64" y="250" font-size="11" text-anchor="end" dominant-baseline="middle" fill="#333333">0</text>
  <text id="tick-y-500" x="64" y="150" font-size="11" text-anchor="end" dominant-baseline="middle" fill="#333333">500</text>
  <text id="tick-y-1000" x="64" y="50" font-size="11" text-anchor="end" dominant-baseline="middle" fill="#333333">1000</text>
  <text id="tick-x-0" x="70" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">0</text>
  <text id="tick-x-20" x="162" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">20</text>
  <text id="tick-x-40" x="255" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">40</text>
  <text id="tick-x-60" x="347" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">60</text>
  <text id="tick-x-80" x="440" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">80</text>
  <polyline id="series-tp" points="70,240 162,160 255,90 347,70 440,66" fill="none" stroke="#4C72B0" stroke-width="2"/>
  <text id="axis-y-label" x="70" y="40" font-size="11" text-anchor="start" dominant-baseline="middle" fill="#333333">Throughput (req/s)</text>
  <text id="axis-x-label" x="255" y="288" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#333333">Latency (ms)</text>
</svg>
