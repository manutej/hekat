<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300" font-family="Arial">
  <rect id="background" width="500" height="300" fill="#FFFFFF"/>
  <text id="title" x="250" y="24" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#333333" font-weight="bold">Six regions sold nearly the same</text>
  <line id="axis-x" x1="70" y1="250" x2="440" y2="250" stroke="#000000" stroke-width="1"/>
  <line id="axis-y" x1="70" y1="250" x2="70" y2="50" stroke="#000000" stroke-width="1"/>
  <text id="tick-y-0" x="64" y="250" font-size="11" text-anchor="end" dominant-baseline="middle" fill="#333333">0</text>
  <text id="tick-y-40" x="64" y="150" font-size="11" text-anchor="end" dominant-baseline="middle" fill="#333333">40</text>
  <text id="tick-y-80" x="64" y="50" font-size="11" text-anchor="end" dominant-baseline="middle" fill="#333333">80</text>
  <rect id="bar-0" x="82" y="95" width="40" height="155" fill="#D62728"/>
  <text id="tick-x-0" x="102" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">North</text>
  <rect id="bar-1" x="142" y="85" width="40" height="165" fill="#E8842A"/>
  <text id="tick-x-1" x="162" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">South</text>
  <rect id="bar-2" x="202" y="100" width="40" height="150" fill="#D4B82A"/>
  <text id="tick-x-2" x="222" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">East</text>
  <rect id="bar-3" x="262" y="80" width="40" height="170" fill="#2CA02C"/>
  <text id="tick-x-3" x="282" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">West</text>
  <rect id="bar-4" x="322" y="90" width="40" height="160" fill="#1F77B4"/>
  <text id="tick-x-4" x="342" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">Central</text>
  <rect id="bar-5" x="382" y="98" width="40" height="152" fill="#9467BD"/>
  <text id="tick-x-5" x="402" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">Islands</text>
  <text id="axis-x-label" x="255" y="288" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#333333" data-role="axis-label">Region</text>
  <text id="axis-y-label" x="22" y="150" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#333333" data-role="axis-label" transform="rotate(-90 22 150)">Sales (units)</text>
</svg>
