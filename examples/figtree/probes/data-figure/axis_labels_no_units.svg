<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300" font-family="Arial">
  <rect id="background" width="500" height="300" fill="#FFFFFF"/>
  <text id="title" x="250" y="24" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#333333" font-weight="bold">Loss falls steadily across training</text>
  <line id="axis-x" x1="70" y1="250" x2="440" y2="250" stroke="#000000" stroke-width="1"/>
  <line id="axis-y" x1="70" y1="250" x2="70" y2="50" stroke="#000000" stroke-width="1"/>
  <text id="tick-y-0" x="64" y="250" font-size="11" text-anchor="end" dominant-baseline="middle" fill="#333333">0</text>
  <text id="tick-y-1" x="64" y="150" font-size="11" text-anchor="end" dominant-baseline="middle" fill="#333333">1</text>
  <text id="tick-y-2" x="64" y="50" font-size="11" text-anchor="end" dominant-baseline="middle" fill="#333333">2</text>
  <text id="tick-x-0" x="70" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">0</text>
  <text id="tick-x-25" x="162" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">25</text>
  <text id="tick-x-50" x="255" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">50</text>
  <text id="tick-x-75" x="347" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">75</text>
  <text id="tick-x-100" x="440" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">100</text>
  <polyline id="series-loss" points="70,70 162,120 255,170 347,210 440,235" fill="none" stroke="#4C72B0" stroke-width="2"/>
  <text id="axis-x-label" x="255" y="288" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#333333" data-role="axis-label">Time</text>
  <text id="axis-y-label" x="22" y="150" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#333333" data-role="axis-label" transform="rotate(-90 22 150)">Loss</text>
</svg>
