  <text id="tick-x-2" x="310" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">Model C</text>
  <rect id="bar-3" x="375" y="60" width="60" height="190" fill="#4C72B0"/>
  <text id="value-3" x="405" y="51" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">20</text>
  <text id="tick-x-3" x="405" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">Model D</text>
  <text id="axis-x-label" x="255" y="288" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#333333" data-role="axis-label">Model</text>
  <text id="axis-y-label" x="22" y="150" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#333333" data-role="axis-label" transform="rotate(-90 22 150)">Accuracy (%)</text>
