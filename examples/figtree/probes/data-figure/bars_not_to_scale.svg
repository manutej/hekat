  <text id="tick-x-0" x="120" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">Model A</text>
  <rect id="bar-1" x="185" y="150" width="60" height="100" fill="#4C72B0"/>
  <text id="value-1" x="215" y="141" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">87</text>
  <text id="tick-x-1" x="215" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">Model B</text>
  <rect id="bar-2" x="280" y="120" width="60" height="130" fill="#4C72B0"/>
