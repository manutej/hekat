<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300" font-family="Arial">
  <rect id="background" width="500" height="300" fill="#FFFFFF"/>
  <text id="title" x="250" y="24" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#333333" font-weight="bold">Accuracy rises with every epoch</text>
  <line id="axis-x" x1="70" y1="250" x2="440" y2="250" stroke="#000000" stroke-width="1"/>
  <line id="axis-y" x1="70" y1="250" x2="70" y2="50" stroke="#000000" stroke-width="1"/>
  <text id="tick-y-0" x="64" y="250" font-size="11" text-anchor="end" dominant-baseline="middle" fill="#333333">0</text>
  <text id="tick-y-50" x="64" y="150" font-size="11" text-anchor="end" dominant-baseline="middle" fill="#333333">50</text>
  <text id="tick-y-100" x="64" y="50" font-size="11" text-anchor="end" dominant-baseline="middle" fill="#333333">100</text>
  <text id="tick-x-1" x="116" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">1</text>
  <text id="tick-x-2" x="185" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">2</text>
  <text id="tick-x-3" x="254" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">3</text>
  <text id="tick-x-4" x="323" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">4</text>
  <text id="tick-x-5" x="392" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">5</text>
  <polyline id="series-acc" points="116,220 185,170 254,130 323,100 392,80" fill="none" stroke="#4C72B0" stroke-width="2"/>
  <text id="axis-x-label" x="255" y="288" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#333333" data-role="axis-label">Epoch</text>
  <text id="axis-y-label" transform="rotate(-90)" x="-150" y="22" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#333333">Accuracy (%)</text>
</svg>
