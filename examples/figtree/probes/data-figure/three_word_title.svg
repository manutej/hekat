<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300" font-family="Arial">
  <rect id="background" width="500" height="300" fill="#FFFFFF"/>
  <text id="title" x="250" y="24" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#333333" font-weight="bold">Quarterly Sales Overview</text>
  <line id="axis-x" x1="70" y1="250" x2="440" y2="250" stroke="#000000" stroke-width="1"/>
  <line id="axis-y" x1="70" y1="250" x2="70" y2="50" stroke="#000000" stroke-width="1"/>
  <text id="tick-y-0" x="64" y="250" font-size="11" text-anchor="end" dominant-baseline="middle" fill="#333333">0</text>
  <text id="tick-y-5" x="64" y="150" font-size="11" text-anchor="end" dominant-baseline="middle" fill="#333333">5</text>
  <text id="tick-y-10" x="64" y="50" font-size="11" text-anchor="end" dominant-baseline="middle" fill="#333333">10</text>
  <rect id="bar-0" x="90" y="126" width="60" height="124" fill="#4C72B0"/>
  <text id="tick-x-0" x="120" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">Q1</text>
  <rect id="bar-1" x="185" y="108" width="60" height="142" fill="#4C72B0"/>
  <text id="tick-x-1" x="215" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">Q2</text>
  <rect id="bar-2" x="280" y="114" width="60" height="136" fill="#4C72B0"/>
  <text id="tick-x-2" x="310" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">Q3</text>
  <rect id="bar-3" x="375" y="82" width="60" height="168" fill="#4C72B0"/>
  <text id="tick-x-3" x="405" y="266" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">Q4</text>
  <text id="axis-x-label" x="255" y="288" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#333333" data-role="axis-label">Quarter</text>
  <text id="axis-y-label" x="22" y="150" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#333333" data-role="axis-label" transform="rotate(-90 22 150)">Sales ($M)</text>
</svg>
