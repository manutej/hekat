<svg xmlns="http://www.w3.org/2000/svg" width="392" height="240" viewBox="0 0 392 240" font-family="Times New Roman">
  <rect id="background" x="0" y="0" width="392" height="240" fill="#FFFFFF" data-role="background"/>
  <defs>
    <marker id="figtree-arrow" markerWidth="5" markerHeight="3.5" refX="5" refY="1.75" orient="auto" markerUnits="userSpaceOnUse">
      <path id="figtree-arrow-head" d="M0,0 L5,1.75 L0,3.5 z" fill="#333333"/>
    </marker>
  </defs>
  <rect id="a.block" x="24" y="24" width="160" height="48" fill="#7BA3C9" stroke="#333333" stroke-width="1.2" rx="4" data-role="block"/>
  <text id="a.label" x="104" y="48" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#333333" data-kind="label"><tspan id="a.l1" x="104" y="40">The user submits</tspan><tspan id="a.l2" x="104" y="57">the request form.</tspan></text>
  <rect id="b.block" x="208" y="24" width="160" height="48" fill="#7BA3C9" stroke="#333333" stroke-width="1.2" rx="4" data-role="block"/>
  <text id="b.label" x="288" y="48" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#333333" data-kind="label"><tspan id="b.l1" x="288" y="40">The server validates</tspan><tspan id="b.l2" x="288" y="57">every field received.</tspan></text>
  <rect id="c.block" x="24" y="96" width="160" height="48" fill="#7BA3C9" stroke="#333333" stroke-width="1.2" rx="4" data-role="block"/>
  <text id="c.label" x="104" y="120" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#333333" data-kind="label"><tspan id="c.l1" x="104" y="112">Otherwise the record</tspan><tspan id="c.l2" x="104" y="129">is saved to the DB.</tspan></text>
  <rect id="d.block" x="208" y="96" width="160" height="48" fill="#7BA3C9" stroke="#333333" stroke-width="1.2" rx="4" data-role="block"/>
  <text id="d.label" x="288" y="120" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#333333" data-kind="label"><tspan id="d.l1" x="288" y="112">If a field fails,</tspan><tspan id="d.l2" x="288" y="129">an error is shown.</tspan></text>
  <rect id="e.block" x="24" y="168" width="160" height="48" fill="#7BA3C9" stroke="#333333" stroke-width="1.2" rx="4" data-role="block"/>
  <text id="e.label" x="104" y="192" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#333333" data-kind="label"><tspan id="e.l1" x="104" y="184">Then a confirmation</tspan><tspan id="e.l2" x="104" y="201">email is sent.</tspan></text>
  <rect id="f.block" x="208" y="168" width="160" height="48" fill="#7BA3C9" stroke="#333333" stroke-width="1.2" rx="4" data-role="block"/>
  <text id="f.label" x="288" y="192" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#333333" data-kind="label"><tspan id="f.l1" x="288" y="184">Finally the user</tspan><tspan id="f.l2" x="288" y="201">sees a success page.</tspan></text>
  <path id="f1" d="M184,48 H208" fill="none" stroke="#333333" stroke-width="1.2" data-flow="data" marker-end="url(#figtree-arrow)"/>
  <path id="f2" d="M288,72 V96" fill="none" stroke="#333333" stroke-width="1.2" data-flow="data" marker-end="url(#figtree-arrow)"/>
  <path id="f3" d="M208,120 H184" fill="none" stroke="#333333" stroke-width="1.2" data-flow="data" marker-end="url(#figtree-arrow)"/>
  <path id="f4" d="M104,144 V168" fill="none" stroke="#333333" stroke-width="1.2" data-flow="data" marker-end="url(#figtree-arrow)"/>
  <path id="f5" d="M184,192 H208" fill="none" stroke="#333333" stroke-width="1.2" data-flow="data" marker-end="url(#figtree-arrow)"/>
</svg>
