  <text id="tile-users-value" x="32" y="150" font-size="32" text-anchor="start" dominant-baseline="middle" fill="#333333" font-weight="bold">12,480</text>
  <text id="tile-users-note" x="32" y="300" font-size="12" text-anchor="start" dominant-baseline="middle" fill="#555555">last 7 days</text>
  <rect id="tile-revenue" x="178" y="16" width="280" height="328" fill="#F7F7F7" rx="8" stroke="#E0E0E0" stroke-width="1"/>
