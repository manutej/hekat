  <text id="tile-sessions-note" x="36" y="300" font-size="12" text-anchor="start" dominant-baseline="middle" fill="#555555">last 7 days</text>
  <rect id="tile-views" x="224" y="16" width="192" height="328" fill="#F7F7F7" rx="8" stroke="#E0E0E0" stroke-width="1"/>
