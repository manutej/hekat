<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="Arial">
  <rect id="background" width="640" height="400" fill="#FFFFFF"/>
  <rect id="tile-users" x="16" y="16" width="296" height="176" fill="#F7F7F7" rx="8" stroke="#E0E0E0" stroke-width="1"/>
  <text id="tile-users-label" x="36" y="48" font-size="13" text-anchor="start" dominant-baseline="middle" fill="#333333">Active users</text>
  <text id="tile-users-value" x="36" y="108" font-size="40" text-anchor="start" dominant-baseline="middle" fill="#333333" font-weight="bold">12,480</text>
  <text id="tile-users-delta" x="36" y="160" font-size="12" text-anchor="start" dominant-baseline="middle" fill="#1B7F4B">+4.2% vs last week</text>
  <rect id="tile-revenue" x="328" y="16" width="296" height="176" fill="#F7F7F7" rx="8" stroke="#E0E0E0" stroke-width="1"/>
  <text id="tile-revenue-label" x="348" y="48" font-size="13" text-anchor="start" dominant-baseline="middle" fill="#333333">Revenue</text>
  <text id="tile-revenue-value" x="348" y="108" font-size="40" text-anchor="start" dominant-baseline="middle" fill="#333333" font-weight="bold">$84.2K</text>
  <text id="tile-revenue-delta" x="348" y="160" font-size="12" text-anchor="start" dominant-baseline="middle" fill="#1B7F4B">+1.1% vs last week</text>
  <rect id="tile-churn" x="16" y="208" width="296" height="176" fill="#F7F7F7" rx="8" stroke="#E0E0E0" stroke-width="1"/>
  <text id="tile-churn-label" x="36" y="240" font-size="13" text-anchor="start" dominant-baseline="middle" fill="#333333">Churn</text>
  <text id="tile-churn-value" x="36" y="300" font-size="40" text-anchor="start" dominant-baseline="middle" fill="#333333" font-weight="bold">2.1%</text>
  <text id="tile-churn-delta" x="36" y="352" font-size="12" text-anchor="start" dominant-baseline="middle" fill="#B5452A">+0.3 pt vs last week</text>
  <rect id="tile-signups" x="328" y="208" width="296" height="176" fill="#F7F7F7" rx="8" stroke="#E0E0E0" stroke-width="1"/>
  <text id="tile-signups-label" x="348" y="240" font-size="13" text-anchor="start" dominant-baseline="middle" fill="#333333">Weekly signups</text>
  <text id="tile-signups-value" x="348" y="300" font-size="40" text-anchor="start" dominant-baseline="middle" fill="#333333" font-weight="bold">1,284</text>
  <line id="tile-signups-baseline" x1="520" y1="352" x2="604" y2="352" stroke="#999999" stroke-width="1" stroke-dasharray="3 2"/>
  <polyline id="tile-signups-sparkline" points="520,340 532,344 544,334 556,350 568,328 580,338 592,322 604,318" fill="none" stroke="#4C72B0" stroke-width="2"/>
  <text id="tile-signups-span" x="348" y="352" font-size="12" text-anchor="start" dominant-baseline="middle" fill="#555555">8 wk, dashed = 4-wk avg</text>
</svg>
