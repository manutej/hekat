<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" data-figtree="1" role="img" aria-labelledby="m1a-title m1a-desc"><title id="m1a-title">A fixed script compared with an agent</title><desc id="m1a-desc">Top: a fixed script runs the same three steps for every message and stops when a question does not fit. Bottom: an agent reads the question, decides between answering from plan documents, asking a clarifying question, or handing to a person, then acts.</desc><rect id="m1a-background" x="0" y="0" width="960" height="470" fill="#FFFFFF" data-role="background"/><defs><marker id="m1a-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,3 L0,6 z" fill="#2B3A4A"/></marker><symbol id="icon-document" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 17h7"/></symbol>
<symbol id="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="icon-split" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h6"/><path d="M10 12l6-6h4M10 12l6 6h4"/><path d="M17 3l3 3-3 3M17 15l3 3-3 3"/></symbol>
<symbol id="icon-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6h14M12 6v14M8 20h8"/></symbol>
<symbol id="icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></symbol></defs><rect id="m1a-r1" x="24" y="24" width="912" height="168" rx="12" fill="#F8F9FB" stroke="#D5DBE4" stroke-width="1.4" data-role="container"/><text id="m1a-t2" x="40" y="48" font-size="15" fill="#5B6B7C" text-anchor="start" font-weight="600" data-kind="title">A fixed script</text><text id="m1a-t3" x="170" y="48" font-size="13" fill="#5B6B7C" text-anchor="start" data-kind="annot">runs the same steps for every message</text><path id="m1a-b4" d="M40,62 h250 v89 h-250 z M60,151 l-8,10 l14,-10 z" fill="#FFFFFF" stroke="#2B3A4A" stroke-width="1.2" data-role="block"/><text id="m1a-t5" x="54" y="80" font-size="11" fill="#5B6B7C" text-anchor="start" data-kind="annot">Member</text><text id="m1a-t6" x="54" y="100" font-size="14" fill="#1C2630" text-anchor="start" data-kind="label">My daughter turns 26 next</text><text id="m1a-t7" x="54" y="119" font-size="14" fill="#1C2630" text-anchor="start" data-kind="label">month. What changes for her</text><text id="m1a-t8" x="54" y="138" font-size="14" fill="#1C2630" text-anchor="start" data-kind="label">coverage?</text><rect id="m1a-r9" x="330" y="88" width="150" height="44" rx="8" fill="#E6E8EC" stroke="#2B3A4A" stroke-width="1.4" data-role="block"/><text id="m1a-t10" x="405" y="115" font-size="13" fill="#1C2630" text-anchor="middle" data-kind="label">Check keyword list</text><path id="m1a-a11" d="M480,110 L504,110" fill="none" stroke="#2B3A4A" stroke-width="1.6" marker-end="url(#m1a-arrow)" data-flow="data"/><rect id="m1a-r12" x="504" y="88" width="150" height="44" rx="8" fill="#E6E8EC" stroke="#2B3A4A" stroke-width="1.4" data-role="block"/><text id="m1a-t13" x="579" y="115" font-size="13" fill="#1C2630" text-anchor="middle" data-kind="label">Match a canned answer</text><path id="m1a-a14" d="M654,110 L678,110" fill="none" stroke="#2B3A4A" stroke-width="1.6" marker-end="url(#m1a-arrow)" data-flow="data"/><rect id="m1a-r15" x="678" y="88" width="150" height="44" rx="8" fill="#E6E8EC" stroke="#2B3A4A" stroke-width="1.4" data-role="block"/><text id="m1a-t16" x="753" y="115" font-size="13" fill="#1C2630" text-anchor="middle" data-kind="label">Send it</text><path id="m1a-a17" d="M296,110 L330,110" fill="none" stroke="#2B3A4A" stroke-width="1.6" marker-end="url(#m1a-arrow)" data-flow="data"/><path id="m1a-a18" d="M828,110 L844,110" fill="none" stroke="#B5472F" stroke-width="1.6" marker-end="url(#m1a-arrow)" data-flow="data"/><rect id="m1a-r19" x="844" y="88" width="96" height="44" rx="8" fill="#F6D9D2" stroke="#B5472F" stroke-width="1.4" data-role="block"/><text id="m1a-t20" x="892" y="115" font-size="13" fill="#B5472F" text-anchor="middle" font-weight="600" data-kind="label">No match</text><text id="m1a-t21" x="330" y="162.0" font-size="13" fill="#5B6B7C" text-anchor="start" data-kind="annot">“dependent” is not on the list, so the member gets “Sorry, I did not understand” and</text><text id="m1a-t22" x="330" y="179.55" font-size="13" fill="#5B6B7C" text-anchor="start" data-kind="annot">calls instead.</text><rect id="m1a-r23" x="24" y="212" width="912" height="236" rx="12" fill="#F8F9FB" stroke="#D5DBE4" stroke-width="1.4" data-role="container"/><text id="m1a-t24" x="40" y="236" font-size="15" fill="#5B6B7C" text-anchor="start" font-weight="600" data-kind="title">An agent</text><text id="m1a-t25" x="118" y="236" font-size="13" fill="#5B6B7C" text-anchor="start" data-kind="annot">reads, decides, then acts</text><path id="m1a-b26" d="M40,250 h250 v89 h-250 z M60,339 l-8,10 l14,-10 z" fill="#FFFFFF" stroke="#2B3A4A" stroke-width="1.2" data-role="block"/><text id="m1a-t27" x="54" y="268" font-size="11" fill="#5B6B7C" text-anchor="start" data-kind="annot">Member</text><text id="m1a-t28" x="54" y="288" font-size="14" fill="#1C2630" text-anchor="start" data-kind="label">My daughter turns 26 next</text><text id="m1a-t29" x="54" y="307" font-size="14" fill="#1C2630" text-anchor="start" data-kind="label">month. What changes for her</text><text id="m1a-t30" x="54" y="326" font-size="14" fill="#1C2630" text-anchor="start" data-kind="label">coverage?</text><rect id="m1a-r31" x="330" y="262" width="150" height="56" rx="8" fill="#F3C9A4" stroke="#2B3A4A" stroke-width="1.4" data-role="block"/><use id="m1a-i32" href="#icon-eye" x="344" y="280" width="20" height="20" color="#2B3A4A" data-role="icon"/><text id="m1a-t33" x="372" y="286" font-size="14" fill="#1C2630" text-anchor="start" font-weight="600" data-kind="label">Reads it</text><text id="m1a-t34" x="372" y="304" font-size="12" fill="#5B6B7C" text-anchor="start" data-kind="annot">whole question</text><path id="m1a-a35" d="M296,298 L330,298" fill="none" stroke="#2B3A4A" stroke-width="1.6" marker-end="url(#m1a-arrow)" data-flow="data"/><rect id="m1a-r36" x="520" y="262" width="150" height="56" rx="8" fill="#F3C9A4" stroke="#2B3A4A" stroke-width="1.4" data-role="block"/><use id="m1a-i37" href="#icon-split" x="534" y="280" width="20" height="20" color="#2B3A4A" data-role="icon"/><text id="m1a-t38" x="562" y="286" font-size="14" fill="#1C2630" text-anchor="start" font-weight="600" data-kind="label">Decides</text><text id="m1a-t39" x="562" y="304" font-size="12" fill="#5B6B7C" text-anchor="start" data-kind="annot">which path fits</text><path id="m1a-a40" d="M480,290 L520,290" fill="none" stroke="#2B3A4A" stroke-width="1.6" marker-end="url(#m1a-arrow)" data-flow="data"/><rect id="m1a-r41" x="712" y="232" width="220" height="42" rx="8" fill="#D5EBDD" stroke="#2F8F6B" stroke-width="1.4" data-role="block"/><use id="m1a-i42" href="#icon-document" x="722" y="243" width="18" height="18" color="#2B3A4A" data-role="icon"/><text id="m1a-t43" x="748" y="258" font-size="12.5" fill="#1C2630" text-anchor="start" font-weight="600" data-kind="label">Answer from plan documents</text><path id="m1a-a44" d="M670,290 L690,290 L690,253 L712,253" fill="none" stroke="#2F8F6B" stroke-width="1.6" marker-end="url(#m1a-arrow)" data-flow="data"/><rect id="m1a-r45" x="712" y="286" width="220" height="42" rx="8" fill="#C9DCF0" stroke="#2B3A4A" stroke-width="1.4" data-role="block"/><use id="m1a-i46" href="#icon-text" x="722" y="297" width="18" height="18" color="#2B3A4A" data-role="icon"/><text id="m1a-t47" x="748" y="312" font-size="12.5" fill="#1C2630" text-anchor="start" data-kind="label">Ask one clarifying question</text><path id="m1a-a48" d="M670,290 L690,290 L690,307 L712,307" fill="none" stroke="#9A9A9A" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#m1a-arrow)" data-flow="control"/><rect id="m1a-r49" x="712" y="340" width="220" height="42" rx="8" fill="#C9DCF0" stroke="#2B3A4A" stroke-width="1.4" data-role="block"/><use id="m1a-i50" href="#icon-user" x="722" y="351" width="18" height="18" color="#2B3A4A" data-role="icon"/><text id="m1a-t51" x="748" y="366" font-size="12.5" fill="#1C2630" text-anchor="start" data-kind="label">Hand to a person</text><path id="m1a-a52" d="M670,290 L690,290 L690,361 L712,361" fill="none" stroke="#9A9A9A" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#m1a-arrow)" data-flow="control"/><text id="m1a-t53" x="40" y="412.0" font-size="13" fill="#5B6B7C" text-anchor="start" data-kind="annot">The agent chooses the first path: the plan documents say a dependent is covered to the end of the month they turn 26, so it answers that,</text><text id="m1a-t54" x="40" y="429.55" font-size="13" fill="#5B6B7C" text-anchor="start" data-kind="annot">in the plan&#x27;s own words.</text></svg>